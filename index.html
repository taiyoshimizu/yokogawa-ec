<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qualit 公開商品データ取得 PoC</title>
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#182230; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7fa; }
    main { max-width:1120px; margin:auto; padding:44px 20px 72px; }
    h1 { margin:0 0 10px; font-size:30px; }
    .lead { margin:0 0 20px; color:#556070; line-height:1.75; }
    .note { background:#fff7df; border:1px solid #f1ce6d; border-radius:10px; padding:14px 16px; line-height:1.65; margin-bottom:20px; }
    .actions { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
    button { border:0; border-radius:8px; background:#1266b1; color:#fff; padding:12px 18px; font-size:14px; font-weight:700; cursor:pointer; }
    .status { color:#596579; min-height:24px; margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
    .card { background:#fff; border:1px solid #e0e6ed; border-radius:12px; overflow:hidden; box-shadow:0 3px 14px rgba(20,34,50,.05); }
    .pic { aspect-ratio:4/3; background:#fff; display:flex; align-items:center; justify-content:center; }
    .pic img { width:100%; height:100%; object-fit:contain; }
    .body { padding:15px; }
    .tag { display:inline-block; font-size:12px; font-weight:700; padding:4px 8px; border-radius:999px; background:#edf4ff; color:#16578f; margin-bottom:9px; }
    h2 { margin:0 0 12px; font-size:15px; line-height:1.55; min-height:70px; }
    .price { font-size:21px; font-weight:800; margin:0 0 10px; }
    .code { font-size:12px; color:#697586; margin:0 0 14px; }
    a { display:block; text-align:center; text-decoration:none; color:#0d548b; background:#f0f5f9; padding:10px; border-radius:8px; font-weight:700; }
    .error { color:#b42318; }
  </style>
</head>
<body>
<main>
  <h1>Qualit 公開商品データ取得 PoC</h1>
  <p class="lead">Vercel側からQualitの公開ページを取得し、現在掲載されている「新着商品」「おすすめ商品」の商品名・価格・画像・商品URLを抽出して表示します。</p>
  <div class="note"><strong>認証情報は不要です。</strong> これはMakeShop公式APIではなく、Qualitの公開HTMLをVercelのAPIで取得・整形する検証です。</div>
  <div class="actions"><button id="reload">最新データを再取得</button></div>
  <p class="status" id="status">取得待ち</p>
  <section id="products" class="grid"></section>
</main>
<script>
const statusEl = document.getElementById('status');
const productsEl = document.getElementById('products');
const yen = new Intl.NumberFormat('ja-JP');

function esc(v='') {
  return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function render(products) {
  productsEl.innerHTML = products.map(p => `
    <article class="card">
      <div class="pic"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></div>
      <div class="body">
        <span class="tag">${p.type === 'new' ? '新着商品' : 'おすすめ商品'}</span>
        <h2>${esc(p.name)}</h2>
        <p class="price">${p.price == null ? '価格取得不可' : yen.format(p.price) + '円（税込）'}</p>
        <p class="code">商品コード: ${esc(p.systemCode)}</p>
        <a href="${esc(p.url)}" target="_blank" rel="noopener">Qualitで商品を見る</a>
      </div>
    </article>`).join('');
}

async function load() {
  statusEl.className = 'status';
  statusEl.textContent = 'Qualitから最新の商品情報を取得中…';
  productsEl.innerHTML = '';
  try {
    const r = await fetch('/api/products', {cache:'no-store'});
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || '取得に失敗しました');
    render(data.products || []);
    statusEl.textContent = `${data.count}件取得しました（新着 ${data.newCount}件 / おすすめ ${data.recommendCount}件）｜取得時刻: ${new Date(data.fetchedAt).toLocaleString('ja-JP')}`;
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = '取得失敗: ' + e.message;
  }
}

document.getElementById('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
